spring:
  application:
    name: arya-banking-admin-service

  profiles:
    active: dev

  config:
    import: vault://

  cloud:
    config:
      uri: http://localhost:8090

    vault:
      uri: http://localhost:8091
      authentication: APPROLE

      app-role:
        role-id: 56f12350-0ada-4904-fd4f-950b7ce713fe
        secret-id: 48d80e1a-d1ae-8c0f-e14e-c2b0f2124751
      kv:
        enabled: true
        backend: secret
        kv-version: 2
        default-context: ""
        application-name: arya-banking/admin-service
        profile-separator: /